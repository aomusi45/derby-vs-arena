
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VS ARENA 単発3D動作テスト</title>
<style>
body {
  background:#09221f;
  color:#f8e5ad;
  font-family:system-ui;
  padding:18px;
}
button {
  padding:12px;
  margin:8px 0;
}
#engine {
  width:100%;
  height:70vh;
  border:1px solid #b89551;
}
pre {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>
<h1>単発・大阪杯 3D動作テスト</h1>
<p>
テスト専用。公式大会の結果・出走情報は変更しません。
3Dエンジン接続の試験であり、自動発走・結果保存は未実装です。
</p>

<button id="load">登録馬を読み込み、3Dエンジンを準備</button>
<button id="start" disabled>3Dエンジンに出走馬を送る</button>

<pre id="msg">未実行</pre>

<iframe
  id="engine"
  title="DBF Ver.92 3Dエンジン"
  src="about:blank">
</iframe>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';

const cfg = {
  apiKey:'AIzaSyDgdYcIr03txu21GqvK04_ZwK7kffaQxgY',
  authDomain:'derby-vs-arena.firebaseapp.com',
  projectId:'derby-vs-arena',
  appId:'1:998531404443:web:3436b76df88abd4f706c3e'
};

const app = initializeApp(cfg);
const db = getFirestore(app);
const auth = getAuth(app);

const id = 'test_single_osaka_001';
let entries = [];

const msg = document.getElementById('msg');
const frame = document.getElementById('engine');
const start = document.getElementById('start');

function say(s) {
  msg.textContent = s;
}

function getUser() {
  return new Promise((resolve,reject) => {
    const unsubscribe = onAuthStateChanged(
      auth,
      user => {
        unsubscribe();
        resolve(user);
      },
      error => {
        unsubscribe();
        reject(error);
      }
    );
  });
}

document.getElementById('load').onclick = async () => {
  start.disabled = true;
  entries = [];

  try {
    say('登録馬を読み込み中…');

    let user = auth.currentUser || await getUser();

    if (!user) {
      const credential = await signInAnonymously(auth);
      user = credential.user;
    }

    const entryRef = doc(
      db,
      'races',
      id,
      'entries',
      user.uid
    );

    const snapshot = await getDoc(entryRef);

    if (!snapshot.exists()) {
      throw new Error(
        'この端末のログインIDでは登録馬が見つかりません。登録時と同じブラウザで開いてください。'
      );
    }

    const data = snapshot.data();

    if (!data.horseJson) {
      throw new Error('登録馬のJSONデータがありません');
    }

    const horse = JSON.parse(data.horseJson);

    entries = [horse];

    frame.onload = () => {
      say(
        '1頭を取得。3Dエンジンを読み込みました。\n' +
        '準備状態を確認してから送信してください。'
      );
      start.disabled = false;
    };

    frame.src = './engine_source.html';

    say('1頭を取得しました。エンジン読み込み中…');

  } catch (e) {
    say('読み込み失敗: ' + (e.message || e));
  }
};

const keys = [
  'sp',
  'sta',
  'kick',
  'early',
  'sustain',
  'grit',
  'stability'
];

start.onclick = () => {
  try {
    const w = frame.contentWindow;
    const shared = w.DFV30SharedRace;

    if (!shared || typeof shared.start !== 'function') {
      throw new Error(
        'Ver.92のVSブリッジがまだ準備できていません'
      );
    }

    const field = entries.map((d,i) => {
      if (
        !d.horse ||
        !d.raceStats ||
        !d.raceContext ||
        !keys.every(
          k => Number.isFinite(
            Number(d.raceStats[k]?.total)
          )
        )
      ) {
        throw new Error('馬データ形式が不正です');
      }

      const c = d.raceContext;
      const h = d.horse;

      return {
        id:String(d.sourceHorseId),
        name:String(d.name || h.name),
        sex:d.sex || h.sex || '牡',
        age:Number(d.age || 4),
        coatType:d.coatType || h.coatType || '鹿毛',
        growth:d.growth || h.growth || '普通',
        tactic:c.tactic || h.tactic || '先行',
        speed:Number(d.raceStats.sp.total),
        sta:Number(d.raceStats.sta.total),
        kick:Number(d.raceStats.kick.total),
        early:Number(d.raceStats.early.total),
        sustain:Number(d.raceStats.sustain.total),
        grit:Number(d.raceStats.grit.total),
        stability:Number(d.raceStats.stability.total),
        bestDistance:Number(c.bestDistance || 2000),
        aptMin:Number(c.aptMin || 1200),
        aptMax:Number(c.aptMax || 3000),
        going:c.goingAptitude || {},
        health:Number(c.health || 90),
        temperament:Number(c.temperament || 85),
        form:Number(c.form || 75),
        fatigue:Number(c.fatigue || 0),
        isCom:false,
        number:i+1
      };
    });

    const result = shared.start(field,2000,'良');

    say(
      'VSブリッジ応答: ' +
      JSON.stringify(result) +
      '\n※ 実際の発走にはゲーム内の新聞画面で「レーススタート」が必要な場合があります。'
    );

  } catch (e) {
    say('起動準備失敗: ' + (e.message || e));
  }
};
</script>
</body>
</html>
